<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Z Sports animated logo</title>
  <desc id="desc">A bold orange Z spins above the word SPORTS on a black background.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB02E"/>
      <stop offset="0.52" stop-color="#FF7900"/>
      <stop offset="1" stop-color="#E94B00"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .z-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: zSpin 5s cubic-bezier(.45,.05,.55,.95) infinite;
      }
      .orbit {
        transform-origin: 400px 330px;
        animation: orbitSpin 12s linear infinite;
      }
      @keyframes zSpin {
        0%, 12% { transform: rotateY(0deg) scale(1); }
        50% { transform: rotateY(180deg) scale(1.04); }
        88%, 100% { transform: rotateY(360deg) scale(1); }
      }
      @keyframes orbitSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .z-spin, .orbit { animation: none; }
      }
    </style>
  </defs>

  <rect width="800" height="800" rx="72" fill="#050505"/>
  <circle cx="400" cy="330" r="244" fill="#0D0D0D" stroke="#242424" stroke-width="3"/>
  <g class="orbit" fill="none" stroke="url(#orange)" stroke-linecap="round">
    <ellipse cx="400" cy="330" rx="270" ry="95" stroke-width="5" opacity=".78" transform="rotate(-28 400 330)"/>
    <path d="M170 215 Q205 166 258 149" stroke-width="9"/>
    <circle cx="664" cy="250" r="8" fill="#FF8A00" stroke="none"/>
  </g>
  <circle cx="400" cy="330" r="204" fill="#080808" stroke="#FF7900" stroke-opacity=".22" stroke-width="2"/>

  <g class="z-spin" filter="url(#glow)">
    <path d="M260 205 H555 V270 L365 438 H555 V510 H245 V444 L435 277 H260 Z"
          fill="url(#orange)" stroke="#FFB02E" stroke-width="5" stroke-linejoin="round"/>
    <path d="M281 225 H527" stroke="#FFD18A" stroke-width="7" stroke-linecap="round" opacity=".72"/>
  </g>

  <path d="M225 574 H575" stroke="#FF7900" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="655" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900"
        letter-spacing="15" fill="#F7F7F7">SPORTS</text>
  <text x="400" y="704" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700"
        letter-spacing="8" fill="#FF8A00">PLAY • COMPETE • WIN</text>
</svg>
